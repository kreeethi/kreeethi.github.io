      rel="stylesheet"

    <!-- Resolve theme before first paint, so there's no flash of the wrong
         theme while React mounts. Mirrors the same storage key and fallback
         logic ThemeToggle uses at runtime. -->
    <script>
      (function () {
        var STORAGE_KEY = "krithi-portfolio-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var isDark = stored ? stored === "dark" : prefersDark;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
